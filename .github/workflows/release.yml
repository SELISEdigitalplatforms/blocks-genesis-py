name: Publish PyPI package

# Invoked only by main.yml, after the test/sonar gates pass on a push to main.
# workflow_dispatch is kept as a manual escape hatch.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write   # needed to push the version tag
  id-token: write    # needed for PyPI Trusted Publishing (OIDC)

concurrency:
  group: pypi-publish
  cancel-in-progress: false

env:
  PROJECT_FILE: pyproject.toml

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Same scheme as blocks-genesis-net / blocks-genesis-react: the MAJOR is
      # declared in pyproject.toml and only ever changes by a deliberate commit;
      # minor and patch are derived from what's already on PyPI.
      # `counter = minor*10 + patch + 1` means patch walks 0..9 and then rolls
      # into the next minor (4.0.9 -> 4.1.0).
      - name: Resolve next version
        id: version
        run: |
          set -euo pipefail

          name=$(python -c "import tomllib; print(tomllib.load(open('$PROJECT_FILE','rb'))['project']['name'])")
          declared=$(python -c "import tomllib; print(tomllib.load(open('$PROJECT_FILE','rb'))['project']['version'])")
          major=$(echo "$declared" | cut -d. -f1 | sed 's/^0*//')
          major=${major:-0}
          echo "Package: $name"
          echo "Declared version in pyproject.toml: $declared (major: $major)"

          # A brand-new package name 404s here; `|| echo '{}'` turns that into an
          # empty history so the first release starts the major cleanly.
          published=$(curl -sfL "https://pypi.org/pypi/${name}/json" | jq -r '.releases | keys[]' 2>/dev/null || echo "")

          latest=$(echo "$published" \
            | grep -E "^${major}\.[0-9]+\.[0-9]+$" \
            | sort -t. -k2,2n -k3,3n \
            | tail -n1 || true)

          if [ -z "$latest" ]; then
            minor=0
            patch=0
            echo "No published $major.x.y found — starting this major at $major.0.0"
          else
            echo "Highest published for major $major: $latest"
            counter=$(( $(echo "$latest" | cut -d. -f2) * 10 + $(echo "$latest" | cut -d. -f3) + 1 ))
            minor=$(( counter / 10 ))
            patch=$(( counter % 10 ))
          fi

          version="${major}.${minor}.${patch}"
          echo "Next version: $version"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing \`$name\` **$version**" >> "$GITHUB_STEP_SUMMARY"

      # Written only into this runner's checkout — never committed.
      - name: Stamp version into pyproject.toml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "0,/^version = \".*\"/s//version = \"${VERSION}\"/" "$PROJECT_FILE"
          grep -m1 '^version' "$PROJECT_FILE"

      - name: Build distribution packages
        run: uv build

      - name: Verify distribution metadata
        run: uv tool run twine check dist/*

      # Auth is OIDC Trusted Publishing (configured on pypi.org for this repo +
      # workflow): no token, no secret.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Tag the release
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
