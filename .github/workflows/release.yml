name: Publish package to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      # 0.3.6 to 0.3.8 were cut from a branch without main, so main's delegation checks never shipped.
      - name: Refuse a release that does not contain main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor origin/main HEAD || {
            echo "::error::The release commit does not contain origin/main. Merge main into it first."; exit 1; }

      - name: Refuse a tag that does not match the package version
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d '"' -f2)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}."; exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      # uv build has no --locked flag, so refuse a uv.lock that no longer matches pyproject.toml first.
      - name: Refuse a stale lock file
        run: uv lock --check

      - name: Build distribution packages
        run: uv build

      - name: Verify distribution metadata
        run: uv tool run twine check dist/*

      - name: Upload distribution packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish distribution
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

