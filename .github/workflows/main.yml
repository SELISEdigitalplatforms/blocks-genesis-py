name: Build (main)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write
  # Needed on release-job for PyPI Trusted Publishing (OIDC).
  id-token: write

# One pipeline per ref. A newer push supersedes an in-flight PR run, but pushes
# to main are never cancelled — that would abort a publish midway.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUN_SONARQUBE: "true"
  PROJECT_FILE: pyproject.toml

jobs:
  initialization:
    runs-on: ubuntu-latest
    outputs:
      envvalue1: ${{ steps.setvar.outputs.envvar1 }}
    steps:
      - name: Set values
        id: setvar
        run: |
          echo "envvar1=$RUN_SONARQUBE" >> $GITHUB_OUTPUT

  sonarqube-job:
    if: ${{ needs.initialization.outputs.envvalue1 == 'true' }}
    needs: [initialization]
    uses: ./.github/workflows/2_sonar.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_GLOBAL }}

  # Publishes only after the gate is green, and only on a push. On a PR this
  # job shows as skipped — never make it a required status check, since a
  # skipped required check blocks merges exactly like a failing one.
  #
  # This job runs its publish steps directly in main.yml rather than via a
  # called reusable workflow (as blocks-genesis-net / blocks-genesis-react do
  # for NuGet/npm). PyPI Trusted Publishing verifies two different OIDC claims
  # that disagree for a reusable workflow: the token exchange matches on
  # job_workflow_ref (the called workflow), but the sigstore attestation's
  # Build Config URI records workflow_ref (the root/caller workflow) — so no
  # single Trusted Publisher config can satisfy both and PyPI rejects the
  # upload with a 400. Keeping the publish job inline here makes both claims
  # resolve to this same file, so the PyPI Trusted Publisher only ever needs
  # to be registered once, as `main.yml`, with attestations left enabled.
  release-job:
    name: Build and publish
    if: ${{ github.event_name == 'push' }}
    needs: [sonarqube-job]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the version tag
      id-token: write   # PyPI Trusted Publishing (OIDC)

    # Never run two publishes at once — they would race on the registry and on tags.
    concurrency:
      group: pypi-publish
      cancel-in-progress: false

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Same scheme as blocks-genesis-net / blocks-genesis-react: the MAJOR is
      # declared in pyproject.toml and only ever changes by a deliberate commit;
      # minor and patch are derived from what's already on PyPI.
      # `counter = minor*10 + patch + 1` means patch walks 0..9 and then rolls
      # into the next minor (4.0.9 -> 4.1.0).
      - name: Resolve next version
        id: version
        run: |
          set -euo pipefail

          name=$(python -c "import tomllib; print(tomllib.load(open('$PROJECT_FILE','rb'))['project']['name'])")
          declared=$(python -c "import tomllib; print(tomllib.load(open('$PROJECT_FILE','rb'))['project']['version'])")
          major=$(echo "$declared" | cut -d. -f1 | sed 's/^0*//')
          major=${major:-0}
          echo "Package: $name"
          echo "Declared version in pyproject.toml: $declared (major: $major)"

          # A brand-new package name 404s here; `|| echo '{}'` turns that into an
          # empty history so the first release starts the major cleanly.
          published=$(curl -sfL "https://pypi.org/pypi/${name}/json" | jq -r '.releases | keys[]' 2>/dev/null || echo "")

          latest=$(echo "$published" \
            | grep -E "^${major}\.[0-9]+\.[0-9]+$" \
            | sort -t. -k2,2n -k3,3n \
            | tail -n1 || true)

          if [ -z "$latest" ]; then
            minor=0
            patch=0
            echo "No published $major.x.y found — starting this major at $major.0.0"
          else
            echo "Highest published for major $major: $latest"
            counter=$(( $(echo "$latest" | cut -d. -f2) * 10 + $(echo "$latest" | cut -d. -f3) + 1 ))
            minor=$(( counter / 10 ))
            patch=$(( counter % 10 ))
          fi

          version="${major}.${minor}.${patch}"
          echo "Next version: $version"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing \`$name\` **$version**" >> "$GITHUB_STEP_SUMMARY"

      # Written only into this runner's checkout — never committed.
      - name: Stamp version into pyproject.toml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "0,/^version = \".*\"/s//version = \"${VERSION}\"/" "$PROJECT_FILE"
          grep -m1 '^version' "$PROJECT_FILE"

      - name: Build distribution packages
        run: uv build

      - name: Verify distribution metadata
        run: uv tool run twine check dist/*

      # Auth is OIDC Trusted Publishing (configured on pypi.org for this repo +
      # this file, main.yml): no token, no secret. Attestations are enabled —
      # see the note on release-job above for why that requires this job to
      # run inline rather than via a reusable workflow.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Tag the release
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
